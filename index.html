<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extended Minecraft Clone</title>
    <style>
        canvas { border: 1px solid black; }
        body { display: flex; flex-direction: column; align-items: center; }
        #info { margin: 10px; }
    </style>
</head>
<body>
    <div id="info">Select Block: <button onclick="selectBlock('grass')">Grass</button>
        <button onclick="selectBlock('dirt')">Dirt</button>
        <button onclick="selectBlock('stone')">Stone</button></div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        const blocks = {};
        let selectedBlock = 'grass'; // Default block type

        // Function to draw blocks
        function drawBlocks() {
            for (const key in blocks) {
                const [x, y] = key.split(',').map(Number);
                ctx.fillStyle = blocks[key]; // Block color based on type
                ctx.fillRect(x * gridSize, y * gridSize, gridSize, gridSize);
            }
        }

        // Mouse click to place block
        canvas.addEventListener('click', (event) => {
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((event.clientX - rect.left) / gridSize);
            const y = Math.floor((event.clientY - rect.top) / gridSize);
            blocks[`${x},${y}`] = getBlockColor(selectedBlock); // Place block
            draw();
        });

        // Function to get block color based on type
        function getBlockColor(type) {
            switch (type) {
                case 'grass': return 'green';
                case 'dirt': return 'brown';
                case 'stone': return 'gray';
                default: return 'white';
            }
        }

        // Block selection
        function selectBlock(type) {
            selectedBlock = type;
        }

        // Player movement
        const player = { x: 0, y: 0 };
        document.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowUp') player.y--;
            if (event.key === 'ArrowDown') player.y++;
            if (event.key === 'ArrowLeft') player.x--;
            if (event.key === 'ArrowRight') player.x++;
            draw();
        });

        // Draw loop
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBlocks();
            ctx.fillStyle = 'blue'; // Player color
            ctx.fillRect(player.x * gridSize, player.y * gridSize, gridSize, gridSize); // Draw player
        }

        draw();
    </script>
</body>
</html>
